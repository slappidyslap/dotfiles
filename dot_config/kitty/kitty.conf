clear_all_shortcuts yes

background_opacity 0.9

window_padding_width 4
# padding_fill_strategy neighboring_cell

cursor_trail 10

confirm_os_window_close 0

scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
map ctrl+shift+h show_scrollback

map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+kp_subtract change_font_size all -2.0

map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+plus change_font_size all +2.0
map ctrl+shift+kp_add change_font_size all +2.0

map ctrl+shift+backspace change_font_size all 0

enable_audio_bell no

map --allow-fallback=shifted,ascii ctrl+shift+c copy_to_clipboard
map --allow-fallback=shifted,ascii ctrl+shift+v paste_from_clipboard

# BEGIN_KITTY_FONTS
font_family      family='Nordwand Mono' style=SemiBold
bold_font        auto
italic_font      family='Nordwand Mono' style='SemiBold Italic'
bold_italic_font family='Nordwand Mono' style='Bold Italic'
# END_KITTY_FONTS
